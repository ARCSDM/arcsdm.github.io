<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f5">
  <title>Asset Portal</title>

  <style>
    :root {
      --arc-blue: #2075B7;
      --accent: #B41F78;
      --ink: #20262C;
      --muted: #707A83;
      --line: #E5E9EC;
      --soft: #F6F8F9;
      --white: #FFFFFF;
      --shadow: 0 18px 45px rgba(26,39,51,.10);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: #EEF2F5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg,#F8FAFB 0%,#EEF2F5 100%);
      padding: 26px 16px;
    }

    .portal-shell {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .portal-card {
      width: 100%;
      background: var(--white);
      border: 1px solid rgba(32,117,183,.08);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .top-rule {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      height: 6px;
    }

    .top-rule span:first-child { background: var(--accent); }
    .top-rule span:last-child  { background: var(--arc-blue); }

    .content {
      padding: 34px 30px 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--arc-blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .asset-type-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(30px,7vw,44px);
      line-height: 1.04;
      font-weight: 800;
      letter-spacing: -.03em;
      overflow-wrap: anywhere;
    }

    .friendly-id-subtitle {
      margin: 9px 0 0;
      color: var(--ink);
      font-size: clamp(18px,4.5vw,23px);
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -.01em;
      overflow-wrap: anywhere;
    }

    .bam-id {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: .045em;
      overflow-wrap: anywhere;
    }

    .organization {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .organization-label {
      display: block;
      margin-bottom: 5px;
      color: #8A9299;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .organization-name {
      display: block;
      min-height: 24px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.35;
      font-weight: 700;
    }

    .asset-image-wrap {
      display: none;
      margin-top: 22px;
      width: 100%;
      height: clamp(210px, 34vh, 285px);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--soft);
    }

    .asset-image-wrap.visible {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .asset-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: var(--soft);
    }

    .asset-links {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    .asset-link {
      min-height: 54px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid var(--arc-blue);
      border-radius: 12px;
      background: var(--white);
      color: var(--arc-blue);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: background .18s ease,color .18s ease,transform .18s ease;
    }

    .asset-link::after {
      content: "↗";
      font-size: 17px;
    }

    .asset-link:hover {
      background: var(--arc-blue);
      color: var(--white);
      transform: translateY(-1px);
    }

    .asset-link.disabled {
      border-color: #D9DEE2;
      background: #F7F8F9;
      color: #9BA3AA;
      pointer-events: none;
    }

    .asset-link.disabled::after {
      content: "—";
    }

    .load-message {
      margin: 14px 0 0;
      color: #8A9299;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .brand-zone {
      margin-top: 28px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .brand-logos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: center;
    }

    .brand-link {
      min-height: 74px;
      padding: 8px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      text-decoration: none;
    }

    .client-brand-link:hover {
      background: var(--soft);
    }

    .arc-brand-link:hover {
      background: var(--soft);
    }

    .brand-logo {
      display: block;
      max-width: 100%;
      max-height: 54px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .arc-brand-link .brand-logo {
      max-height: 48px;
    }

    .solution-tagline {
      margin: 26px 0 0;
      text-align: center;
      color: var(--arc-blue);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: .055em;
    }

    .powered-by {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .bam-logo {
      display: block;
      width: auto;
      height: 22px;
      max-width: 100px;
      object-fit: contain;
    }

    @media (max-width:520px) {
      body {
        padding: 10px 8px;
      }

      .content {
        padding: 24px 18px 22px;
      }

      .asset-image-wrap {
        margin-top: 18px;
        height: clamp(190px, 31vh, 240px);
        border-radius: 12px;
      }

      .asset-links {
        margin-top: 18px;
      }

      .brand-zone {
        margin-top: 22px;
        padding-top: 22px;
      }

      .brand-logos {
        gap: 14px;
      }

      .brand-link {
        min-height: 66px;
        padding-left: 6px;
        padding-right: 6px;
      }

      .solution-tagline {
        margin-top: 20px;
        font-size: 14px;
      }
    }

    @media (max-width:380px) {
      .asset-image-wrap {
        height: 200px;
      }

      .asset-type-title {
        font-size: 30px;
      }

      .friendly-id-subtitle {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="portal-shell">
    <section class="portal-card" id="portalCard">
      <div class="top-rule" aria-hidden="true">
        <span id="categoryAccent"></span><span></span>
      </div>

      <div class="content">
        <p class="eyebrow">Asset Portal</p>

        <h1 id="assetType" class="asset-type-title">Loading Asset</h1>
        <p id="friendlyId" class="friendly-id-subtitle"></p>
        <p id="bamId" class="bam-id">Retrieving asset record…</p>

        <div class="organization">
          <span class="organization-label">Client / Organization</span>
          <span id="organizationName" class="organization-name">—</span>
        </div>

        <div id="assetImageWrap" class="asset-image-wrap">
          <img id="assetImage" class="asset-image" alt="Asset image">
        </div>

        <div class="asset-links" aria-label="Digital asset access">
          <a id="matterportLink" class="asset-link disabled" href="#" aria-disabled="true">
            Open in Matterport
          </a>

          <a id="skandLink" class="asset-link disabled" href="#" aria-disabled="true">
            Open in SKAND
          </a>
        </div>

        <p id="loadMessage" class="load-message">Connecting to asset registry…</p>

        <div class="brand-zone">
          <div class="brand-logos">
            <a
              id="orgLink"
              class="brand-link client-brand-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Client website"
            >
              <img id="orgLogo" class="brand-logo" alt="Client logo">
            </a>

            <a
              class="brand-link arc-brand-link"
              href="https://arc-corporate.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Architectural Resource Consultants website"
            >
              <img
                class="brand-logo"
                src="originalPortrait_whiteletters.png"
                alt="Architectural Resource Consultants"
              >
            </a>
          </div>

          <p class="solution-tagline">INTEGRATED | OPERATION READY™</p>

          <div class="powered-by">
            <span>Powered by</span>
            <img
              class="bam-logo"
              src="BAM_Logo-lightbg.png"
              alt="BAM"
            >
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      console.log("ARC Asset Portal v10.1 loaded");

      var API_URL =
        "https://script.google.com/macros/s/AKfycbzpgb8SihK2Fo84NXWr6DqwXw7GNaXQhymVFqQlPol1S5DpcGKuKOh6vNyYR4z4l7lK/exec";

      /*
       * v10 client-side instant-load cache.
       *
       * The API / workbook remain authoritative.
       * Cached values are used only to make repeat QR scans render immediately,
       * then the live API refreshes them in the background.
       */
      var CLIENT_CACHE_TTL_MS = 6 * 60 * 60 * 1000;       // 6 hours
      var CLIENT_STALE_FALLBACK_MS = 7 * 24 * 60 * 60 * 1000; // 7 days
      var META_CACHE_PREFIX = "arc_asset_portal_meta_v10_";
      var IMAGE_CACHE_PREFIX = "arc_asset_portal_image_v10_";
      var IMAGE_CACHE_INDEX_KEY = "arc_asset_portal_image_index_v10";
      var MAX_LOCAL_IMAGE_ENTRIES = 10;

      var ORGS = {
        LAUS: {
          name: "LAUS",
          logo: "LAUSLogo2.png",
          url: "https://www.unionstationla.com/"
        },
        BRAGG: {
          name: "BRAGG Companies",
          logo: "BRAGGLogo.png",
          url: "https://www.braggcompanies.com/"
        }
      };

      var CATEGORY_COLORS = {
        "Electrical": "#d69414",
        "Mechanical": "#2e7d5a",
        "Plumbing": "#146edc",
        "Fire / Life Safety": "#c41e3a",
        "Fire - Life Safety": "#c41e3a",
        "Fire/Life Safety": "#c41e3a",
        "Specialty / Other": "#a82878",
        "Specialty - Other": "#a82878"
      };

      function applyCategoryAccent(asset) {
        var category = valueFrom(asset, [
          "Asset Category",
          "Category"
        ]);

        var accent = document.getElementById("categoryAccent");
        if (!accent) return;

        accent.style.backgroundColor =
          CATEGORY_COLORS[category] || "#B41F78";

        if (category) {
          accent.setAttribute("title", "Asset Category: " + category);
          accent.setAttribute("aria-label", "Asset Category: " + category);
        }
      }

      function valueFrom(record, names) {
        if (!record || !names) return "";

        for (var i = 0; i < names.length; i++) {
          var value = record[names[i]];

          if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
          ) {
            return String(value).trim();
          }
        }

        return "";
      }

      function setLink(id, url) {
        var el = document.getElementById(id);

        if (url && /^https?:\/\//i.test(url)) {
          el.href = url;
          el.target = "_blank";
          el.rel = "noopener noreferrer";
          el.classList.remove("disabled");
          el.removeAttribute("aria-disabled");
        } else {
          el.href = "#";
          el.removeAttribute("target");
          el.classList.add("disabled");
          el.setAttribute("aria-disabled", "true");
        }
      }

      function setOrganization(asset) {
        var raw = valueFrom(asset, [
          "Organization",
          "Client / Organization",
          "Client"
        ]);

        var config = ORGS[raw] || null;
        var name = raw || (config ? config.name : "—");

        document.getElementById("organizationName").textContent = name;

        var link = document.getElementById("orgLink");
        var logo = document.getElementById("orgLogo");

        if (config) {
          link.href = config.url;
          logo.src = config.logo;
          logo.alt = config.name + " logo";
        } else {
          link.href = "#";
          logo.removeAttribute("src");
          logo.alt = "Client logo";
        }
      }

      function setAssetImageUrl(url) {
        var wrap = document.getElementById("assetImageWrap");
        var img = document.getElementById("assetImage");

        wrap.classList.remove("visible");
        img.removeAttribute("src");

        if (!url) return;

        img.onload = function () {
          wrap.classList.add("visible");
        };

        img.onerror = function () {
          wrap.classList.remove("visible");
          img.removeAttribute("src");
        };

        img.src = url;
      }

      function renderMetadata(asset) {
        var assetType = valueFrom(asset, [
          "Asset Type",
          "Type"
        ]);

        var friendlyId = valueFrom(asset, [
          "Friendly Asset ID",
          "Friendly ID",
          "FriendlyID",
          "Friendly_Id"
        ]);

        var bamId = valueFrom(asset, [
          "BAM Asset ID",
          "Generated Asset ID",
          "Asset ID",
          "BAM ID"
        ]);

        var matterport = valueFrom(asset, [
          "Matterport",
          "Matterport View",
          "Matterport Link",
          "Matterport URL"
        ]);

        var skand = valueFrom(asset, [
          "Skand",
          "SKAND",
          "SKAND View",
          "Skand View",
          "Skand Link",
          "SKAND Link",
          "Skand URL",
          "SKAND URL"
        ]);

        document.getElementById("assetType").textContent =
          assetType || "ASSET";

        document.getElementById("friendlyId").textContent =
          friendlyId || "";

        document.getElementById("bamId").textContent =
          bamId || "BAM ID NOT AVAILABLE";

        setOrganization(asset);
        applyCategoryAccent(asset);
        setLink("matterportLink", matterport);
        setLink("skandLink", skand);

        document.getElementById("loadMessage").textContent = "";
      }

      function renderFinalFailure(message) {
        document.getElementById("assetType").textContent =
          "ASSET UNAVAILABLE";

        document.getElementById("friendlyId").textContent = "";

        document.getElementById("bamId").textContent =
          "Unable to retrieve asset record";

        document.getElementById("organizationName").textContent = "—";

        setLink("matterportLink", "");
        setLink("skandLink", "");
        setAssetImageUrl("");

        document.getElementById("loadMessage").textContent =
          message || "The asset registry could not be reached.";
      }

      function storageGet(key) {
        try {
          var raw = window.localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          return null;
        }
      }

      function storageSet(key, value) {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (error) {
          return false;
        }
      }

      function storageRemove(key) {
        try {
          window.localStorage.removeItem(key);
        } catch (error) {}
      }

      function cacheKey(prefix, assetId) {
        return prefix + String(assetId || "").toUpperCase();
      }

      function readClientCache(prefix, assetId) {
        var entry = storageGet(cacheKey(prefix, assetId));

        if (
          !entry ||
          !entry.savedAt ||
          entry.data === undefined ||
          entry.data === null
        ) {
          return null;
        }

        var age = Date.now() - Number(entry.savedAt);

        return {
          data: entry.data,
          age: age,
          fresh: age >= 0 && age <= CLIENT_CACHE_TTL_MS,
          usableFallback:
            age >= 0 && age <= CLIENT_STALE_FALLBACK_MS
        };
      }

      function writeClientCache(prefix, assetId, data) {
        if (data === undefined || data === null || data === "") {
          return false;
        }

        return storageSet(
          cacheKey(prefix, assetId),
          {
            savedAt: Date.now(),
            data: data
          }
        );
      }

      function getImageCacheIndex() {
        var index = storageGet(IMAGE_CACHE_INDEX_KEY);
        return Array.isArray(index) ? index : [];
      }

      function saveImageCacheIndex(index) {
        storageSet(
          IMAGE_CACHE_INDEX_KEY,
          index.slice(0, MAX_LOCAL_IMAGE_ENTRIES)
        );
      }

      function touchImageCache(assetId) {
        var id = String(assetId || "").toUpperCase();
        var index = getImageCacheIndex().filter(function (item) {
          return item !== id;
        });

        index.unshift(id);

        while (index.length > MAX_LOCAL_IMAGE_ENTRIES) {
          var removed = index.pop();
          storageRemove(cacheKey(IMAGE_CACHE_PREFIX, removed));
        }

        saveImageCacheIndex(index);
      }

      function writeImageCache(assetId, image) {
        if (!image) return false;

        var key = cacheKey(IMAGE_CACHE_PREFIX, assetId);
        var payload = {
          savedAt: Date.now(),
          data: image
        };

        if (storageSet(key, payload)) {
          touchImageCache(assetId);
          return true;
        }

        /*
         * localStorage quota can vary by browser.
         * If an image write fails, prune older image entries and retry once.
         * Metadata cache entries are never removed by this cleanup.
         */
        var index = getImageCacheIndex();

        while (index.length > 2) {
          var removed = index.pop();
          storageRemove(cacheKey(IMAGE_CACHE_PREFIX, removed));
        }

        saveImageCacheIndex(index);

        if (storageSet(key, payload)) {
          touchImageCache(assetId);
          return true;
        }

        return false;
      }

      function fetchJson(url, timeoutMs) {
        var controller = new AbortController();
        var timer = setTimeout(function () {
          controller.abort();
        }, timeoutMs);

        return fetch(url, {
          /*
           * v9 used "no-store" plus a Date.now() query parameter, which forced
           * every QR scan to make a completely unique network request.
           *
           * v10 uses stable URLs and normal browser caching. The API's
           * server-side snapshots remain authoritative and the local cache
           * performs an explicit background refresh.
           */
          cache: "default",
          signal: controller.signal
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            return response.json();
          })
          .finally(function () {
            clearTimeout(timer);
          });
      }

      function wait(ms) {
        return new Promise(function (resolve) {
          setTimeout(resolve, ms);
        });
      }

      function fetchWithRetry(url, options) {
        var attempts = options.attempts || 3;
        var timeoutMs = options.timeoutMs || 7000;
        var delays = options.delays || [350, 800];

        function attempt(number) {
          return fetchJson(url, timeoutMs).catch(function (error) {
            if (number >= attempts) {
              throw error;
            }

            var delay =
              delays[Math.min(number - 1, delays.length - 1)] || 500;

            return wait(delay).then(function () {
              return attempt(number + 1);
            });
          });
        }

        return attempt(1);
      }

      function metadataUrl(assetId) {
        return (
          API_URL +
          "?mode=metadata&id=" +
          encodeURIComponent(assetId)
        );
      }

      function imageUrl(assetId) {
        return (
          API_URL +
          "?mode=image&id=" +
          encodeURIComponent(assetId)
        );
      }

      function refreshImageFromApi(assetId, hadVisibleImage) {
        return fetchWithRetry(imageUrl(assetId), {
          attempts: 2,
          timeoutMs: 15000,
          delays: [600]
        })
          .then(function (result) {
            var image = valueFrom(result, ["Image"]);

            if (image) {
              writeImageCache(assetId, image);
              setAssetImageUrl(image);
              return true;
            }

            /*
             * If a previously cached image is already visible, do not remove
             * it merely because one refresh returned no image.
             */
            if (!hadVisibleImage) {
              setAssetImageUrl("");
            }

            return false;
          })
          .catch(function (error) {
            // Image failure must never take down the asset portal.
            console.warn("Asset image unavailable:", error);
            return false;
          });
      }

      function loadImageInstant(assetId) {
        var cached = readClientCache(
          IMAGE_CACHE_PREFIX,
          assetId
        );

        var renderedCachedImage = false;

        if (cached && cached.fresh && cached.data) {
          setAssetImageUrl(cached.data);
          touchImageCache(assetId);
          renderedCachedImage = true;
        }

        /*
         * Image loading begins immediately and independently of metadata.
         * This shortens total first-visit time while preserving the existing
         * rule that Drive image work can never block asset information.
         */
        refreshImageFromApi(
          assetId,
          renderedCachedImage
        ).then(function (loaded) {
          if (
            !loaded &&
            !renderedCachedImage &&
            cached &&
            cached.usableFallback &&
            cached.data
          ) {
            setAssetImageUrl(cached.data);
          }
        });
      }

      function refreshMetadataFromApi(assetId, cachedFallback) {
        return fetchWithRetry(metadataUrl(assetId), {
          attempts: 3,
          timeoutMs: 7000,
          delays: [300, 700]
        })
          .then(function (asset) {
            if (
              !asset ||
              typeof asset !== "object" ||
              Array.isArray(asset) ||
              asset.error
            ) {
              throw new Error("No matching asset record returned.");
            }

            writeClientCache(
              META_CACHE_PREFIX,
              assetId,
              asset
            );

            renderMetadata(asset);

            return asset;
          })
          .catch(function (error) {
            console.error("Asset metadata request failed:", error);

            /*
             * If a recently saved record exists, it is safer and more useful
             * to show it than to replace the portal with an unavailable screen.
             * The message makes the fallback state explicit.
             */
            if (
              cachedFallback &&
              cachedFallback.usableFallback &&
              cachedFallback.data
            ) {
              renderMetadata(cachedFallback.data);

              document.getElementById("loadMessage").textContent =
                "Showing the most recently saved asset information. Live refresh is temporarily unavailable.";

              return cachedFallback.data;
            }

            renderFinalFailure(
              "The asset record could not be retrieved after multiple attempts. Please try again."
            );

            throw error;
          });
      }

      function start() {
        var params = new URLSearchParams(window.location.search);
        var assetId = String(params.get("id") || "").trim();

        if (!assetId) {
          renderFinalFailure("No asset ID was supplied in the QR-code URL.");
          return;
        }

        // Show the scanned BAM ID immediately.
        document.getElementById("bamId").textContent = assetId;

        var cachedMetadata = readClientCache(
          META_CACHE_PREFIX,
          assetId
        );

        /*
         * Repeat scans within the 6-hour client-cache window render the full
         * known asset identity immediately, before any network round trip.
         */
        if (
          cachedMetadata &&
          cachedMetadata.fresh &&
          cachedMetadata.data
        ) {
          renderMetadata(cachedMetadata.data);
        }

        /*
         * Start the image path immediately instead of waiting for metadata.
         * Metadata and image remain completely independent.
         */
        loadImageInstant(assetId);

        /*
         * Always refresh the authoritative metadata in the background.
         * Fresh cached content gives instant first paint; live API data wins
         * as soon as it returns.
         */
        refreshMetadataFromApi(
          assetId,
          cachedMetadata
        );
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
  </script>
</body>
