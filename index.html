<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC SDM</title>

<style>
  body {
    margin: 0;
    font-family: Helvetica, Arial, sans-serif;
    background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    padding: 60px 20px 35px;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
  }

  img {
    width: 110px;
    border-radius: 12px;
    margin-bottom: 15px;
  }

  /* Top Logo */
  a:first-of-type img {
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

  /* Bottom Logo */
  a:last-of-type img {
    width: 135px;
    margin-top: 30px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay: 1s;
  }

  h1 {
    margin-bottom: 10px;
    font-size: 26px;

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay: 0.1s;
  }

  p {
    opacity: 0.8;
    margin-bottom: 16px;

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay: 0.25s;
  }

  .links {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .link {
    display: block;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    padding: 15px;
    margin: 14px auto;
    width: 260px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: bold;
    transition: all 0.25s ease;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 255, 255, 0.2);

    box-shadow: 0 8px 20px rgba(0,0,0,0.2);

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

  .links .link:nth-child(1) { animation-delay: 0.4s; }
  .links .link:nth-child(2) { animation-delay: 0.6s; }
  .links .link:nth-child(3) { animation-delay: 0.8s; }

  .link:hover {
    transform: scale(1.06);
    background: rgba(255, 255, 255, 0.28);
    box-shadow: 0 10px 24px rgba(0,0,0,0.3);
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Mobile tweak */
  @media (max-width: 400px) {
    .link {
      width: 90%;
    }
  }

</style>
</head>

<body>

<a href="https://www.unionstationla.com/" target="_blank" rel="noopener noreferrer">

</a>

</html>
