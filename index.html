<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Asset Portal</title>
  <style>
    :root {
      --arc-blue: #2075B7;
      --ink: #20262C;
      --muted: #6F7881;
      --line: #E6EAED;
      --soft: #F7F9FA;
      --white: #FFFFFF;
      --shadow: 0 18px 45px rgba(26, 39, 51, 0.10);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: #EEF2F5; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #F7F9FB 0%, #EEF2F5 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(26px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom));
    }

    .portal-shell { width: 100%; max-width: 560px; }

    .portal-card {
      background: var(--white);
      border: 1px solid rgba(32, 117, 183, 0.08);
      border-radius: var(--radius-lg);
