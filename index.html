<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC SDM</title>

<style>
  body {
    margin: 0;
    font-family: Helvetica, Arial, sans-serif;
    background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    padding: 70px 20px 40px;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
    .modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;

  background: rgba(0,0,0,0.6);

  justify-content: center;
  align-items: center;

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal-content {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  width: auto;
  max-width: 90%;
  max-height: 90vh;

  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  

  padding: 18px;
  box-sizing: border-box;

  margin: auto;
  
  box-shadow:    
    0 25px 60px rgba(0,0,0,0.6),  
    0 0 30px rgba(255, 255, 255, 0.25);

  border: 1px solid rgba(255,255,255,0.1);
  }

@media (max-width: 600px) {
  .modal-content {
    width: 90%;
    max-width: 340px;

    padding: 18px;
    border-radius: 14px;
  }
}

.modal-image {
  display: block;

  max-width: 100%;
  max-height: 85vh;

  width: auto;
  height: auto;

  border-radius: 10px;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 28px;
  cursor: pointer;
}

.open-btn {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  padding: 12px 20px;
  border-radius: 10px;
  text-decoration: none;
  color: white;
  font-weight: bold
  }

  img {
    width: 110px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
  }

  a img {
    display: block;
    margin: 0 auto 15px;
  }

  a:last-of-type img {
    width: 137.5px;
    margin-top: 30px;

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay: 0.9s;

    box-shadow: none;
  }

  h1 {
    margin-bottom: 12px;

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay: 0.1s;
  }

  p {
    opacity: 0.7;
    margin-bottom: 12px;

    font-size: 17px;

    opacity: 0.7;
  margin-bottom: 12px;
  font-size: 17px;
  }

 
  .links {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .link {
    display: block;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    padding: 15px;
    margin: 16px auto;
    width: 260px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: bold;
    
    font-size: 17px;
    
    transition: 0.25s;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 255, 255, 0.2);

    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }


  .links .link:nth-child(1) { animation-delay: 0.3s; }
  .links .link:nth-child(2) { animation-delay: 0.5s; }
  .links .link:nth-child(3) { animation-delay: 0.7s; }

  .link:hover {
    transform: scale(1.05);
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  a:first-of-type img {
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }
  
.image-wrapper {
  position: relative;
  display: inline-block;
}

/* SVG overlay */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

/* building shapes */
.building {
  fill: rgba(255,255,255,0);  /* invisible */
  stroke: transparent;
  transition: 0.25s;
  cursor: pointer;
}

/* hover glow */
.building:hover {
  transform: scale(1.01);
  fill: rgba(255, 255, 255, 0.08);
  stroke: rgba(255, 255, 255, 0.6);
  stroke-width: 2;

  filter:
    drop-shadow(0 0 6px rgba(255,255,255,0.5))
    drop-shadow(0 0 15px rgba(255,255,255,0.25));
}

svg a {
  outline: none;
}

svg a:focus {
  outline: none;
}

/* initial hidden state */
.modal {
  opacity: 0;
  transition: opacity 0.25s ease;
}

/* when active */
.modal.show {
  display: flex;
  opacity: 1;
}

/* modal animation */
.modal-content {
  transform: scale(0.92);
  opacity: 0;

  transition: transform 0.25s ease, opacity 0.25s ease;
}

.modal.show .modal-content {
  transform: scale(1);
  opacity: 1;
}

.modal-content h2 {
  margin-bottom: 16px;
}

.modal-content p {
  margin-top: 0;
  margin-bottom: 22px;
  line-height: 1.5;
}

.button {
  display: inline-block;
  background: rgba(255, 255, 255, 0.15);
  color: white;
  padding: 12px 20px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
  font-size: 17px;

  transition: 0.25s;

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border: 1px solid rgba(255, 255, 255, 0.2);

  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
}

.button:hover {
  transform: scale(1.05);
  background: rgba(255, 255, 255, 0.25);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
}

.link:focus,
.link:active {
  outline: none;
  box-shadow: none;
} 

.modal-content .link {
  width: auto;
  display: inline-block;
  margin: 10px auto 0;
}

.modal-content > * {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.modal.show .modal-content > * {
  opacity: 1;
  transform: translateY(0);
}
  
</style>
</head>

<body>

<a href="https://www.unionstationla.com/" target="_blank">

<div class="image-wrapper">

  <svg viewBox="0 0 1662 811" class="overlay">

    <!-- Ticketing Concourse -->

    <!-- North Breezeway -->

    <!-- Waiting Room -->

  </svg>
</div>
</div>
</div>
  
<div id="corrigoModal" class="modal">
  <div class="modal-content" style="flex-direction: column; text-align: center; max-width: 420px;">
    

    <h2>No Asset Information</h2>

    <p>
      No asset information exists on this platform.<br>
      Click below to request this asset be added to Corrigo.
    </p>

    
<a class="link" 
   href="https://qblogin.corrigo.com/Login/Login.aspx?secure=1&c=1" 
   target="_blank"
   style="width: auto; margin: 0;">
  Request Asset
</a>

  </div>
</div>
    
<script>

function openModal() {
  const modal = document.getElementById("imageModal");
  modal.style.display = "flex";

  // allow DOM to render before adding class
  requestAnimationFrame(() => {
    modal.classList.add("show");
  });
}

function closeModal() {
  const modal = document.getElementById("imageModal");

  modal.classList.remove("show");

  setTimeout(() => {
    modal.style.display = "none";
  }, 250); // match CSS duration
}

function openCorrigoModal() {
  const modal = document.getElementById("corrigoModal");
  modal.style.display = "flex";

  requestAnimationFrame(() => {
    modal.classList.add("show");
  });
}

function closeCorrigoModal() {
  const modal = document.getElementById("corrigoModal");

  modal.classList.remove("show");

  setTimeout(() => {
    modal.style.display = "none";
  }, 250);
}

/* click outside to close Corrigo modal */
document.getElementById("corrigoModal").addEventListener("click", function(e) {
  if (e.target === this) {
    closeCorrigoModal();
  }
});

  
/* click outside to close */
document.querySelectorAll(".modal").forEach(modal => {
  modal.addEventListener("click", function(e) {
    if (e.target === modal) {
      modal.classList.remove("show");
      setTimeout(() => {
        modal.style.display = "none";
      }, 250);
    }
  });
});

/* press ESC to close */
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    closeModal();
    closeCorrigoModal();
  }
});
  
</script> 
  
</body>
</html>
