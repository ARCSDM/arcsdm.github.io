<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Francisco Reyes</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111, #222);
      color: white;
      text-align: center;
      padding: 40px;
    }

    img {
      width: 100px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .link {
      display: block;
      background: #1db954;
      color: white;
      padding: 15px;
      margin: 10px auto;
      width: 250px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .link:hover {
      background: #17a74a;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <img src="https://via.placeholder.com/100" alt="Profile Picture">

  <h1>Francisco Reyes</h1>

  <a class="link" href="https://instagram.com" target="_blank">Instagram</a>
  <a class="link" href="https://youtube.com" target="_blank">YouTube</a>
  <a class="link" href="https://twitter.com" target="_blank">Twitter</a>
  <a class="link" href="https://yourwebsite.com" target="_blank">My Website</a>

</body>
</html>
