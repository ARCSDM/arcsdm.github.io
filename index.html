<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC SDM</title>

<style>
  body {
    margin: 0;
    font-family: Helvetica, Arial, sans-serif;
    background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    padding: 70px 20px 40px;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
  }

  img {
    width: 110px;
    border-radius: 12px;
    margin-bottom: 15px;
  }

  h1 {
    margin-bottom: 10px;
    animation-delay: 0.1s;
  }

  p {
    opacity: 0.75;
    margin-bottom: 18px;
    animation-delay: 0.2s;
  }

  h1, p, img {
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .links {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .link {
    position: relative;
    overflow: hidden;

    display: block;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    padding: 14px;
    margin: 12px auto;
    width: 90%;
    max-width: 280px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: bold;
