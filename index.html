<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC SDM</title>

<style>
  body {
    margin: 0;
    font-family: Helvetica, Arial, sans-serif;
    background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    padding: 70px 20px 40px;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;

    .modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;

  background: rgba(0,0,0,0.6);

  justify-content: center;
  align-items: center;

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal-content {
  width: 90%;
  max-width: 700px;
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px;
  position: relative;
  text-align: center;
}

.modal-image {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 15px;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 28px;
  cursor: pointer;
}

.open-btn {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  padding: 12px 20px;
  border-radius: 10px;
  text-decoration: none;
  color: white;
  font-weight: bold}
  }

  img {
    width: 110px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
  }

  a img {
    display: block;
    margin: 0 auto 15px;
  }

  a:last-of-type img {
    width: 137.5px;
    margin-top: 30px;

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay: 0.9s;

    box-shadow: none;
  }

  h1 {
    margin-bottom: 12px;

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay: 0.1s;
  }

  p {
    opacity: 0.7;
    margin-bottom: 12px;

    font-size: 17px;

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay: 0.2s;
  }

 
  .links {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .link {
    display: block;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    padding: 15px;
    margin: 16px auto;
    width: 260px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: bold;
    
    font-size: 17px;
    
    transition: 0.25s;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 255, 255, 0.2);

    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }


  .links .link:nth-child(1) { animation-delay: 0.3s; }
  .links .link:nth-child(2) { animation-delay: 0.5s; }
  .links .link:nth-child(3) { animation-delay: 0.7s; }

  .link:hover {
    transform: scale(1.05);
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  a:first-of-type img {
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

</style>
</head>

<body>

<a href="https://www.unionstationla.com/" target="_blank">
  <img src="LAUSLogo.png" alt="Union Station Logo">
</a>

<h1>ASSET PORTAL</h1>
<p>Asset Links Below</p>

<div class="links">
  <a class="link" href="#" onclick="openModal()">Matterport</a>
  <a class="link" href="https://skand.io" target="_blank">Skand</a>
  <a class="link" href="https://qblogin.corrigo.com/Login/Login.aspx?secure=1&c=1" target="_blank">Corrigo</a>
</div>

<a href="https://arc-corporate.com/" target="_blank">
  <img src="ARC_Profile.png" alt="ARC Logo">
</a>
  
<div id="imageModal" class="modal">  
  <div class="modal-content">        
    <span class="close" onclick="closeModal()">&times;</span>    
    <img src="Instruction.png" class="modal-image">    
    <a href="https://my.matterport.com/show/?m=aURcSJvpYMU" target="_blank" class="open-btn">      
      Continue to Matterport    
    </a>  
  
  </div>
</div>

<script>
function openModal() {
  document.getElementById("imageModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("imageModal").style.display = "none";
}
</script>  
  
</body>
</html>
