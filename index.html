<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC SDM</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
  color: white;
  text-align: center;
  padding: 70px 20px 40px;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  align-items: center;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(6px);
}

.modal-content {
  width: 90%;
  max-width: 700px;
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px;
  position: relative;
}

.modal-image {
  width: 100%;
  border-radius: 10px;
}

/* LINKS */
.links {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.link {
  display: block;
  background: rgba(255,255,255,0.15);
  color: white;
  padding: 15px;
  margin: 16px auto;
  width: 260px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;

  transition: 0.25s;
}

.link:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.25);
}

/* IMAGE WRAPPER */
.image-wrapper {
  position: relative;
  width: 100%;
}

/* BLUR OVERLAY */
.blur-overlay {
  position: absolute;
  inset: 0;
  backdrop-filter: blur(6px);
  pointer-events: none;
  opacity: 0;
  transition: 0.3s;
}

.image-wrapper.active .blur-overlay {
  opacity: 1;
}

/* SVG */
.overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.building {
  fill: transparent;
  stroke: transparent;
  cursor: pointer;
  transition: 0.25s;
}

.building:hover {
  fill: rgba(255,255,255,0.15);
  stroke: rgba(255,255,255,0.7);
  stroke-width: 2;

  filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
}

/* REMOVE BLUE OUTLINE */
svg a { outline: none; }
svg a:focus { outline: none; }

</style>
</head>

<body>

<a href="https://www.unionstationla.com/" target="_blank">
  <img src="LAUSLogo.png" width="110">
</a>

<h1>ASSET PORTAL</h1>
<p>Asset Links Below</p>

<div class="links">
  <a class="link" href="#" onclick="openModal()">Matterport</a>
  <a class="link" href="https://skand.io" target="_blank">Skand</a>
  <a class="link" href="https://qblogin.corrigo.com/Login/Login.aspx?secure=1&c=1" target="_blank">Corrigo</a>
</div>

<a href="https://arc-corporate.com/" target="_blank">
  <img src="ARC_Profile.png" width="140">
</a>

<!-- MODAL -->
<div id="imageModal" class="modal">
  <div class="modal-content">

    <div class="image-wrapper">
      <img src="Instruction.png" class="modal-image">
      
      <div class="blur-overlay"></div>

      <svg viewBox="0 0 1662 811" class="overlay">

        <a href="#"><polygon points="445,550 1110,550 1110,700 445,700" class="building"/></a>
        <a href="#"><polygon points="275,560 445,560 445,655 275,655" class="building"/></a>
        <a href="#"><polygon points="95,685 275,685 275,725 95,725" class="building"/></a>
        <a href="#"><polygon points="720,170 915,170 915,550 720,550" class="building"/></a>
        <a href="#"><polygon points="915,170 1085,170 1085,300 915,300" class="building"/></a>
        <a href="#"><polygon points="1020,300 1110,300 1110,550 1020,550" class="building"/></a>
        <a href="#"><polygon points="1110,550 1320,550 1320,690 1110,690" class="building"/></a>
        <a href="#"><polygon points="1320,690 1600,690 1600,730 1320,730" class="building"/></a>
        <a href="#"><polygon points="1040,500 1090,500 1090,550 1040,550" class="building"/></a>

      </svg>
    </div>

  </div>
</div>

<script>
function openModal() {
  document.getElementById("imageModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("imageModal").style.display = "none";
}

/* CLOSE INTERACTIONS */
window.onclick = function(e) {
  const modal = document.getElementById("imageModal");
  if (e.target === modal) closeModal();
};

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeModal();
});

/* BLUR EFFECT */
const wrapper = document.querySelector(".image-wrapper");

document.querySelectorAll(".building").forEach(shape => {
  shape.addEventListener("mouseenter", () => {
    wrapper.classList.add("active");
  });

  shape.addEventListener("mouseleave", () => {
    wrapper.classList.remove("active");
  });
});
</script>

</body>
</html>
