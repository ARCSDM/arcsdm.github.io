<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC SDM</title>

<style>
  body {
    margin: 0;
    font-family: Helvetica, Arial, sans-serif;
    background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    padding: 70px 20px 30px;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
    
.modal {
  position: fixed;
  inset: 0;
  z-index: 999;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.6);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  will-change: transform, opacity;

  min-height: 220px;
  
  width: 90%;
  max-width: 500px;
  
  max-height: 90vh;
  padding: 24px 18px;
  
  background: rgba(255,255,255,0.08);
  border-radius: 16px;

  box-sizing: border-box;
  box-shadow:    
    0 25px 60px rgba(0,0,0,0.6),  
    0 0 30px rgba(255, 255, 255, 0.25);

  border: 1px solid rgba(255,255,255,0.1);
  }
  

.modal-inner {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  
  flex: 1;
  width: 100%;

  text-align: center;
}


@media (max-width: 600px) {
  .modal-content {
    width: 90%;
    max-width: 340px;

    padding: 18px;
    border-radius: 14px;
  }
}

.modal-image {
  display: block;

  max-width: 100%;
  max-height: 85vh;

  width: auto;
  height: auto;

  border-radius: 10px;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 28px;
  cursor: pointer;
}

.open-btn {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  padding: 12px 20px;
  border-radius: 10px;
  text-decoration: none;
  color: white;
  font-weight: bold
  }

  img {
    width: 110px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
  }

  a img {
    display: block;
    margin: 0 auto 15px;
  }

  a:last-of-type img {
    width: 137.5px;
    margin-top: 20px;

    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    animation-delay: 0.7s;

    box-shadow: none;
  }

.page-content h1 {
    margin-bottom: 12px;

    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay: 0.1s;
  }

.page-content p {
    opacity: 0;
    margin-bottom: 12px;
    font-size: 17px;

  animation: fadeUp 0.7s ease forwards;
  animation-delay: 0.2s;
  }

 
 .page-content .links {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

.link {
  display: block;
  width: 260px;

  background: rgba(255, 255, 255, 0.15);
  color: white;

  padding: 15px;
  margin: 16px auto;

  border-radius: 14px;
  text-decoration: none;

  font-weight: bold;
  font-size: 17px;
  text-align: center;

  transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;

  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);

  user-select: none;
}  
  
.page-content .link {
  opacity: 0;
  animation: fadeUp 0.7s ease forwards;
}

.page-content .links .link:nth-child(1) { animation-delay: 0.225s; }
.page-content .links .link:nth-child(2) { animation-delay: 0.350s; }
.page-content .links .link:nth-child(3) { animation-delay: 0.475s; }

  .link:hover {
    transform: scale(1.05);
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  }
  
  .link:active {
  transform: scale(1);
}

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  a:first-of-type img {
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

svg a {
  outline: none;
}

svg a:focus {
  outline: none;
}

/* initial hidden state */
.modal {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity 0.25s ease,
    visibility 0s linear 0.25s;
}

.modal.show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transition:
    opacity 0.25s ease,
    visibility 0s linear 0s;
}

/* modal animation */
.modal-content {
  transform: scale(0.98);
  opacity: 0;

  transition: transform 0.25s ease, opacity 0.25s ease;
}

.modal.show .modal-content {
  transform: scale(1);
  opacity: 1;
}

.modal-content h2 {
  margin: 0 0 16px 0;
}

.modal-content p {
  margin-top: 0;
  margin-bottom: 22px;
  line-height: 1.5;
}

.modal-content .link {
  width: auto;
  display: inline-block;
  padding: 12px 18px;
  margin: 10px auto;
  transform: none !important;
}

.modal-content .link:hover {
  transform: none !important;
}

.modal-content .link:active {
  transform: none !important;
}
  
.button:focus,
.button:active,
.button:focus-visible,
.link:focus,
.link:active,
.link:focus-visible {
  outline: none;
  box-shadow: none;
}

.button {
  -webkit-user-select: none;
  user-select: none;
}

* {
  -webkit-tap-highlight-color: transparent;
}

.modal-content .link:hover {
  transform: none;
}

.modal-content .link:active {
  transform: none;
}  

.asset-id-text {
  margin-top: 10px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #ff4d4d;
  user-select: none;

  opacity: 0;
  transform: translateY(10px);
}

.asset-id-text.show {
  animation: fadeUp 0.7s ease forwards;
}

</style>
</head>

<body>

<a href="https://www.unionstationla.com/" target="_blank">
  <img src="LAUSLogo.png" alt="Union Station Logo">
</a>

<div class="page-content">
  
<h1>ASSET PORTAL</h1>
<p>Asset Links Below</p>

<div id="assetIdLabel" class="asset-id-text">
  —
</div>

<div class="links">
  <a class="link matterport-link" id="matterportBtn" href="#">Matterport</a>
  <a class="link skand-link" id="skandBtn" href="#">Skand</a>
  <a class="link corrigo-link" id="corrigoBtn" href="#">Corrigo</a>
</div>

</div>
  
<a href="https://arc-corporate.com/" target="_blank">
  <img src="ARC_Profile.png" alt="ARC Logo">
</a>

<div id="imageModal" class="modal">  
<div class="modal-content">
  <div class="modal-inner">
    <h2>Select Desired Link</h2>

    <a class="link"
       href="https://my.matterport.com/show/?m=qwcoKpTrRVJ&play=0&ss=114&sr=-3.09%2C-.45&tag=JtCMdLO13Z8&pin-pos=-3.67%2C.49%2C27.5"
       target="_blank">
      Location of Asset
    </a>
    
    <a class="link"
       href="https://my.matterport.com/show/?m=qwcoKpTrRVJ&play=0&ss=151&sr=-.57%2C-1.55&tag=UuwsxyY1Gct&pin-pos=-41.37%2C1.56%2C18.46"
       target="_blank">
      South Patio Tour
    </a>
  </div>
</div>
</div>

<div id="corrigoModal" class="modal">  
<div class="modal-content">
  <div class="modal-inner">

    <h2>No Asset Information</h2>

    <p>
      No asset information exists on this platform.<br>
      Click below to request this asset be added to Corrigo.
    </p>

    
<a class="link"
   href="https://qblogin.corrigo.com/Login/Login.aspx?secure=1&c=1" 
   target="_blank"
   tabindex="-1">
  Request Asset
</a>

  </div>
</div>
</div>
    
<script>
    
function openModal() {
  const modal = document.getElementById("imageModal");

modal.classList.add("show");
}

function closeModal() {
  const modal = document.getElementById("imageModal");
  modal.classList.remove("show");
  document.activeElement.blur();
}

function openCorrigoModal() {
  document.getElementById("corrigoModal").classList.add("show");
}

function closeCorrigoModal() {
  const modal = document.getElementById("corrigoModal");
  modal.classList.remove("show");
  document.activeElement.blur();
}

function setupButtons() {
  const matterportBtn = document.getElementById("matterportBtn");
  const corrigoBtn = document.getElementById("corrigoBtn");
  const skandBtn = document.getElementById("skandBtn");

  if (matterportBtn) {
    matterportBtn.addEventListener("click", function (e) {
      e.preventDefault();

      if (!currentAsset) {
        openModal();
        return;
      }

      const link = currentAsset?.Matterport;

      if (link && link !== "a") {
        window.open(link, "_blank");
      } else {
        openModal();
      }
    });
  }

  if (corrigoBtn) {
    corrigoBtn.addEventListener("click", function (e) {
      e.preventDefault();

      if (!currentAsset) {
        openCorrigoModal();
        return;
      }

      const link = currentAsset?.Corrigo;

      if (link && link !== "a") {
        window.open(link, "_blank");
      } else {
        openCorrigoModal();
      }
    });
  }

  if (skandBtn) {
    skandBtn.addEventListener("click", function (e) {
      e.preventDefault();

      if (!currentAsset) return;

      const link = currentAsset?.Skand;

      if (link && link !== "a") {
        window.open(link, "_blank");
      }
    });
  }
}

document.getElementById("corrigoModal").addEventListener("click", function(e) {
  if (e.target === this) {
    closeCorrigoModal();
  }
});

  
/* click outside to close */
document.querySelectorAll(".modal").forEach(modal => {
  modal.addEventListener("click", function(e) {
    if (e.target === modal) {
      closeModal();
      closeCorrigoModal();
    }
  });
});

/* press ESC to close */
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    closeModal();
    closeCorrigoModal();
    document.activeElement.blur();
  }
});

let assetData = [];
let currentAsset = null;

fetch("assets.json")
  .then(res => res.json())
  .then(data => {
    assetData = data;

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const decodedId = decodeURIComponent(id || "").trim();

    console.log("ID from QR:", decodedId);

    currentAsset = assetData.find(a =>
  String(a["Generated Asset ID"] || "").trim() === String(decodedId).trim()
);

    console.log("Matched asset:", currentAsset);

    const label = document.getElementById("assetIdLabel");

if (label) {
  label.textContent = currentAsset
    ? currentAsset["Generated Asset ID"]
    : "INVALID ASSET";

  label.style.color = currentAsset
    ? "#ff4d4d"
    : "rgba(255,100,100,0.8)";

  requestAnimationFrame(() => {
    label.classList.add("show");
  });
}

    setupButtons();
  });
  
</script> 
  
</body>
</html>
