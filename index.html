<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC SDM</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
  color: white;
  text-align: center;
  padding: 70px 20px 40px;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  align-items: center;
}

img {
  width: 110px;
  border-radius: 12px;
  margin-bottom: 15px;
}

h1 {
  margin-bottom: 10px;
}

p {
  opacity: 0.75;
  margin-bottom: 18px;
}

/* Links */
.links {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.link {
  position: relative;
  overflow: hidden;

  display: block;
  background: rgba(255,255,255,0.15);
  color: white;
  padding: 14px;
  margin: 12px auto;
  width: 90%;
  max-width: 280px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;

  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);

  transition: 0.25s;
}

.link:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.25);
}

/* Ripple */
.ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  animation: ripple 0.5s linear;
  background: rgba(255,255,255,0.4);
  pointer-events: none;
}

@keyframes ripple {
  to {
    transform: scale(4);
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- TOP LOGO -->
<a href="https://www.unionstationla.com/" target="_blank">
  <img src="LAUSLogo.png" alt="Union Station Logo">
</a>

<h1>ASSET PORTAL</h1>
<p>Asset Links Below</p>

<div class="links">
  <a class="link" href="https://my.matterport.com/show/?m=aURcSJvpYMU" target="_blank">
    Matterport
  </a>

  <a class="link" href="https://skand.io" target="_blank">
    Skand
  </a>

  <a class="link" href="https://qblogin.corrigo.com/Login/Login.aspx?secure=1&c=1" target="_blank">
    Corrigo
  </a>
</div>

<!-- BOTTOM LOGO -->
<a href="https://arc-corporate.com/" target="_blank">
  <img src="ARC_Profile.png" alt="ARC Logo">
</a>

<script>
document.querySelectorAll('.link').forEach(button => {
  button.addEventListener('click', function(e) {
    const ripple = document.createElement('span');
    ripple.classList.add('ripple');

    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);

    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';

    this.appendChild(ripple);

    setTimeout(() => ripple.remove(), 500);
  });
});
</script>

</body>
</html>
