<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Asset Portal</title>
  <style>
    :root {
      --arc-blue: #2075B7;
      --ink: #20262C;
      --muted: #6F7881;
      --line: #E6EAED;
      --soft: #F7F9FA;
      --white: #FFFFFF;
      --shadow: 0 18px 45px rgba(26, 39, 51, 0.10);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: #EEF2F5; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #F7F9FB 0%, #EEF2F5 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(26px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom));
    }

    .portal-shell { width: 100%; max-width: 560px; }

    .portal-card {
      background: var(--white);
      border: 1px solid rgba(32, 117, 183, 0.08);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .top-rule {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      height: 6px;
    }

    .top-rule::before { content: ""; background: #B41F78; }
    .top-rule::after { content: ""; background: var(--arc-blue); }

    .card-inner { padding: 34px 30px 28px; }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--arc-blue);
    }

    .friendly-id {
      margin: 0;
      font-size: clamp(34px, 8vw, 48px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.035em;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .bam-id {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.045em;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .organization {
      margin: 22px 0 0;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .organization-label {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8A9299;
    }

    .organization-name {
      display: block;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 700;
      color: var(--ink);
    }

    .asset-links { display: grid; gap: 12px; margin-top: 28px; }

    .asset-link {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--arc-blue);
      border-radius: var(--radius-md);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--arc-blue);
      background: var(--white);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .asset-link::after { content: "↗"; font-size: 17px; font-weight: 700; line-height: 1; }

    .asset-link:hover {
      color: var(--white);
      background: var(--arc-blue);
      box-shadow: 0 8px 18px rgba(32, 117, 183, 0.18);
      transform: translateY(-1px);
    }

    .asset-link:active { transform: translateY(0); }

    .asset-link.is-disabled {
      border-color: #D7DDE2;
      background: #F7F8F9;
      color: #9AA2A9;
      cursor: default;
      pointer-events: none;
      box-shadow: none;
    }

    .asset-link.is-disabled::after { content: "—"; }

    .brand-zone {
      margin-top: 32px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .brand-logos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 24px;
    }

    .brand-link {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.18s ease;
    }

    .brand-link:hover { background: var(--soft); }

    .brand-logo {
      display: block;
      max-width: 100%;
      max-height: 62px;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: none;
      border-radius: 0;
    }

    .solution-tagline {
      margin: 26px 0 0;
      text-align: center;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: 0.055em;
      color: var(--ink);
    }

    .powered-by {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .bam-logo {
      display: block;
      width: auto;
      height: 22px;
      max-width: 95px;
      object-fit: contain;
      box-shadow: none;
      border-radius: 0;
    }

    .status-message {
      display: none;
      margin-top: 24px;
      padding: 14px 16px;
      border: 1px solid #E4E8EB;
      border-radius: 10px;
      background: #F8FAFB;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .status-message.show { display: block; }

    .loading .friendly-id,
    .loading .bam-id,
    .loading .organization-name {
      color: transparent;
      border-radius: 6px;
      background: linear-gradient(90deg, #EDF0F2 25%, #F7F8F9 37%, #EDF0F2 63%);
      background-size: 400% 100%;
      animation: shimmer 1.3s ease infinite;
    }

    .loading .friendly-id { width: 54%; }
    .loading .bam-id { width: 42%; }
    .loading .organization-name { width: 48%; min-height: 24px; }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    @media (max-width: 520px) {
      body { padding-left: 12px; padding-right: 12px; }
      .card-inner { padding: 28px 22px 24px; }
      .brand-logos { gap: 14px; }
      .brand-link { padding-left: 6px; padding-right: 6px; }
      .brand-logo { max-height: 54px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }

    .asset-photo {
      display: none;
      width: 112px;
      height: 112px;
      margin: 0 0 22px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .asset-photo.show { display: block; }
  </style>
</head>
<body>
  <main class="portal-shell">
    <section class="portal-card loading" id="portalCard" aria-live="polite">
      <div class="top-rule" aria-hidden="true"></div>

      <div class="card-inner">
        <img id="assetPhoto" class="asset-photo" alt="Asset photo">

        <p class="eyebrow">Asset Portal</p>

        <h1 id="friendlyId" class="friendly-id">Loading</h1>
        <p id="bamId" class="bam-id">Loading</p>

        <div class="organization">
          <span class="organization-label">Client / Organization</span>
          <span id="organizationName" class="organization-name">Loading</span>
        </div>

        <div class="asset-links" aria-label="Digital asset access">
          <a id="matterportLink" class="asset-link is-disabled" href="#" target="_blank" rel="noopener noreferrer">Open in Matterport</a>
          <a id="skandLink" class="asset-link is-disabled" href="#" target="_blank" rel="noopener noreferrer">Open in SKAND</a>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="brand-zone">
          <div class="brand-logos">
            <a id="orgLink" class="brand-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Client website">
              <img id="orgLogo" class="brand-logo" alt="Client logo">
            </a>

            <a class="brand-link" href="https://arc-corporate.com/" target="_blank" rel="noopener noreferrer" aria-label="Architectural Resource Consultants website">
              <img class="brand-logo" src="ARC_Profile.png" alt="Architectural Resource Consultants logo">
            </a>
          </div>

          <p class="solution-tagline">INTEGRATED | OPERATION READY</p>

          <div class="powered-by">
            <span>Powered by</span>
            <img class="bam-logo" src="BAMLogo.png" alt="BAM">
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const ORGS = {
      LAUS: {
        name: "LAUS",
        footerLogo: "LAUSLogo2.png",
        url: "https://www.unionstationla.com/"
      },
      BRAGG: {
        name: "BRAGG Companies",
        footerLogo: "BRAGGLogo.png",
        url: "https://www.braggcompanies.com/"
      }
    };

    const DEFAULT_ORG = "LAUS";

    const API_URL = "https://script.google.com/macros/s/AKfycbzpgb8SihK2Fo84NXWr6DqwXw7GNaXQhymVFqQlPol1S5DpcGKuKOh6vNyYR4z4l7lK/exec";

    const FIELD_NAMES = {
      friendlyId: ["Friendly ID", "FriendlyID", "Friendly_Id"],
      bamId: ["BAM Asset ID", "Generated Asset ID", "Asset ID", "BAM ID"],
      organization: ["Organization", "Client / Organization", "Client"],
      matterport: ["Matterport", "Matterport Link", "Matterport URL"],
      skand: ["Skand", "SKAND", "Skand Link", "SKAND Link", "Skand URL", "SKAND URL"]
    };

    function firstValue(record, keys) {
      if (!record) return "";
      for (const key of keys) {
        const value = record[key];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return String(value).trim();
        }
      }
      return "";
    }

    function organizationConfig(asset) {
      const rawOrganization = firstValue(asset, FIELD_NAMES.organization);
      return {
        rawOrganization,
        config: ORGS[rawOrganization] || ORGS[DEFAULT_ORG] || null
      };
    }

    function configureOrganization(asset) {
      const { rawOrganization, config } = organizationConfig(asset);
      const orgName = ORGS[rawOrganization]?.name || rawOrganization || "Organization";
      document.getElementById("organizationName").textContent = orgName;

      const orgLink = document.getElementById("orgLink");
      const orgLogo = document.getElementById("orgLogo");

      if (config) {
        orgLink.href = config.url || "#";
        orgLogo.src = config.footerLogo || "";
        orgLogo.alt = orgName + " logo";
      } else {
        orgLink.href = "#";
        orgLink.removeAttribute("target");
        orgLogo.removeAttribute("src");
        orgLogo.alt = orgName + " logo";
      }
    }

    function configureAssetLink(elementId, url) {
      const link = document.getElementById(elementId);
      if (url && url !== "a" && url !== "#" && /^https?:\/\//i.test(url)) {
        link.href = url;
        link.classList.remove("is-disabled");
        link.removeAttribute("aria-disabled");
      } else {
        link.href = "#";
        link.classList.add("is-disabled");
        link.setAttribute("aria-disabled", "true");
      }
    }

    function showStatus(message) {
      const status = document.getElementById("statusMessage");
      status.textContent = message;
      status.classList.add("show");
    }

    function finishLoading() {
      document.getElementById("portalCard").classList.remove("loading");
    }

    function renderAsset(asset) {
      const friendlyId = firstValue(asset, FIELD_NAMES.friendlyId);
      const bamId = firstValue(asset, FIELD_NAMES.bamId);
      const matterport = firstValue(asset, FIELD_NAMES.matterport);
      const skand = firstValue(asset, FIELD_NAMES.skand);

      document.getElementById("friendlyId").textContent = friendlyId || "ASSET";
      document.getElementById("bamId").textContent = bamId || "BAM ID NOT AVAILABLE";

      const photo = document.getElementById("assetPhoto");
      if (asset.Image) {
        photo.onload = () => photo.classList.add("show");
        photo.src = asset.Image;
      }

      configureOrganization(asset);
      configureAssetLink("matterportLink", matterport);
      configureAssetLink("skandLink", skand);

      if (!friendlyId || !bamId) {
        showStatus("Some asset identity information is not available for this record.");
      }

      finishLoading();
    }

    function renderInvalidAsset() {
      document.getElementById("friendlyId").textContent = "ASSET NOT FOUND";
      document.getElementById("bamId").textContent = "No matching BAM asset record";
      document.getElementById("organizationName").textContent = "—";
      configureAssetLink("matterportLink", "");
      configureAssetLink("skandLink", "");
      showStatus("This QR code did not return a valid asset record.");
      finishLoading();
    }

    const params = new URLSearchParams(window.location.search);
    const decodedId = (params.get("id") || "").trim();

    if (!decodedId) {
      renderInvalidAsset();
    } else {
      fetch(API_URL + "?id=" + encodeURIComponent(decodedId), { cache: "no-store" })
        .then(response => {
          if (!response.ok) throw new Error("Asset request failed: " + response.status);
          return response.json();
        })
        .then(asset => {
          if (!asset || typeof asset !== "object" || Array.isArray(asset)) {
            renderInvalidAsset();
            return;
          }
          renderAsset(asset);
        })
        .catch(error => {
          console.error("Asset portal error:", error);
          renderInvalidAsset();
        });
    }
  </script>
</body>
</html>
