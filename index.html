<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC SDM</title>

<style>
  body {
    margin: 0;
    font-family: Helvetica, Arial, sans-serif;
    background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    padding: 70px 20px 40px;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
  }

  img {
    width: 110px;
    border-radius: 12px;
    margin-bottom: 15px;
  }

  a img {
    display: block;
    margin: 0 auto 15px;
  }

  a:last-of-type img {
    width: 135px;
    margin-top: 30px;
    animation-delay: 0.9s;
  }

  h1 {
    margin-bottom: 10px;
    font-size: 28px;
    letter-spacing: 1px;
    animation-delay: 0.1s;
  }

  p {
    opacity: 0.75;
    margin-bottom: 18px;
    animation-delay: 0.2s;
  }

  h1, p, a img {
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  /* Links container */
  .links {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .link {
    display: block;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    padding: 14px;
    margin: 12px auto;
    width: 90%;
    max-width: 280px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: bold;
    transition: all 0.25s ease;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 255, 255, 0.2);

    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  /* Stagger animation */
  .links .link:nth-child(1) { animation-delay: 0.3s; }
  .links .link:nth-child(2) { animation-delay: 0.5s; }
  .links .link:nth-child(3) { animation-delay: 0.7s; }

  /* Hover & focus */
  .link:hover,
  .link:focus {
    transform: scale(1.05);
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }

  /* Animation */
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Mobile spacing tweak */
  @media (max-width: 480px) {
    body {
      padding-top: 50px;
    }

    h1 {
      font-size: 24px;
    }
  }

</style>
</head>

<body>

<a href="https://www.unionstationla.com/" target="_blank">
  <img src="LAUSLogo.png" alt="Union Station Logo">
</a>

<h1>ASSET PORTAL</h1>
<p>Asset Links Below</p>

<div class="links">
  <a class="link" href="https://my.matterport.com/show/?m=aURcSJvpYMU" target="_blank">Matterport</a>
  <a class="link" href="https://skand.io" target="_blank">Skand</a>
  <a class="link" href="https://qblogin.corrigo.com/Login/Login.aspx?secure=1&c=1" target="_blank">Corrigo</a>
</div>

<a href="https://arc-corporate.com/" target="_blank">
  <img src="ARC_Profile.png" alt="ARC Logo">
</a>

</body>
</html>
